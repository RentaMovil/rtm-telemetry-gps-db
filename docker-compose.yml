# Migraciones de Telemetry & GPS sobre la base compartida "rentamovil".
# A diferencia de rtm-iam-db, este compose NO levanta SQL Server: esa instancia la levanta
# rtm-iam-db, que es el primero en correr. Aquí solo se aplican los changesets de este repo.
# Orden de ejecución: 3.º (después de fleet, antes de booking — rental.gps_id es FK hacia acá).
services:
  # Una sola vez: corre las migraciones (lo mismo que "mvn liquibase:update") y se apaga.
  # Si ya están aplicadas no hace nada. Imagen en el Dockerfile de este repo.
  migrations:
    build: .
    networks: [rentamovil]
    command:
      - --url=jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE:-rentamovil};encrypt=true;trustServerCertificate=true
      - --username=sa
      - --password=${MSSQL_SA_PASSWORD}
      - --search-path=/liquibase/changelog
      - --changelog-file=changelog/changelog-master.yaml
      - --database-changelog-table-name=DATABASECHANGELOG_TELEMETRY
      - --database-changelog-lock-table-name=DATABASECHANGELOGLOCK_TELEMETRY
      - update
      - -DtelemetryAppPassword=${TELEMETRY_APP_PASSWORD}
    restart: "no"

networks:
  # Red compartida por todos los servicios de RentaMovil, cada uno desde su propio repo
  rentamovil:
    external: true
